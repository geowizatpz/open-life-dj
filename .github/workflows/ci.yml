name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            extra: -DCMAKE_OSX_ARCHITECTURES=arm64;x86_64
          - name: Windows (MSVC)
            os: windows-latest
            extra: ""
          - name: Linux (GCC)
            os: ubuntu-24.04
            extra: ""

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libxi-dev libegl-dev libglu1-mesa-dev mesa-common-dev

      - name: macOS dependencies
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: bash
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release "${{ matrix.extra }}"

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: OpenLifeDJ-${{ runner.os }}
          path: build/app/OpenLifeDJ_artefacts/Release/
          if-no-files-found: warn
